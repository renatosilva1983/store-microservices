# Integração contínua (ADR-23): todo push e PR em main/develop compila e testa back e front e valida o Terraform.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Back-end (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore store-server.slnx

      # Segurança das dependências (SCA): lista pacotes NuGet com vulnerabilidade conhecida,
      # inclusive os transitivos, e quebra o build se houver alguma alta ou crítica.
      - name: Dependências vulneráveis (NuGet)
        run: |
          dotnet list store-server.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -qE '\b(High|Critical)\b' vulnerable.txt; then
            echo "::error::Há pacote com vulnerabilidade alta ou crítica (veja a lista acima)."
            exit 1
          fi

      - name: Build
        run: dotnet build store-server.slnx --no-restore -c Release

      - name: Test
        run: dotnet test store-server.slnx --no-build -c Release --logger "trx;LogFileName=results.trx"

      - name: Publicar resultado dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'

  frontend:
    name: Front-end (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Web/store-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/Web/store-web/package-lock.json

      - name: Instalar dependências
        run: npm ci

      # Mesma verificação no front: só dependências que vão para produção, a partir de "high".
      - name: Dependências vulneráveis (npm)
        run: npm audit --omit=dev --audit-level=high

      - name: Build de produção
        run: npm run build

  terraform:
    name: Infraestrutura (Terraform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~1.17'

      # Formatação padrão: falha se algum .tf não estiver como o terraform fmt deixaria.
      - name: Formatação
        run: terraform fmt -check -recursive infra/terraform

      # -backend=false: valida a sintaxe e as referências sem acessar a AWS nem o state.
      - name: Validar bootstrap
        working-directory: infra/terraform/bootstrap
        run: terraform init -backend=false -input=false && terraform validate

      - name: Validar módulo principal
        working-directory: infra/terraform/aws
        run: terraform init -backend=false -input=false && terraform validate
